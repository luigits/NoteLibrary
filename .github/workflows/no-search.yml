name: build no search
on:

  push:
#    branches: ['master']
  workflow_dispatch:
  # 定时的优先级太低，改用定量 push
permissions:
  id-token: write
  pages: write

env:
  INSTANCE: 'Writerside/luigits-docs'
  DOCKER_VERSION: 'latest'
  IS_GROUP: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.define-ids.outputs.artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Define instance id and artifacts
        id: define-ids
        run: |
          INSTANCE=${INSTANCE#*/}
          INSTANCE_ID_UPPER=$(echo "$INSTANCE" | tr '[:lower:]' '[:upper:]')
          ARTIFACT="webHelp${INSTANCE_ID_UPPER}2-all.zip"
          
          # Print the values
          echo "INSTANCE_ID_UPPER: $INSTANCE_ID_UPPER"
          echo "ARTIFACT: $ARTIFACT"
          
          # Set the environment variables and outputs
          echo "INSTANCE_ID_UPPER=$INSTANCE_ID_UPPER" >> $GITHUB_ENV
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
      
      - name: Build docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{env.INSTANCE}}
          docker-version: ${{ env.DOCKER_VERSION }}
          is-group: ${{ env.IS_GROUP }}
          artifact: ${{ steps.define-ids.outputs.artifact }}
      
      - name: Save artifact with build results
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: |
            artifacts/${{ steps.define-ids.outputs.artifact }}
            artifacts/report.json
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4  # ⚠️ 官方最新稳定版为 v4，v8 不存在
        with:
          name: docs
          path: artifacts

      - name: Verify & Extract
        run: |
          cd artifacts
          echo "=== 文件校验 ==="
          zip -T *.zip || { echo "❌ ZIP 尾部损坏，请检查 build 阶段的上传是否完整"; exit 1; }
          
          echo "=== 使用 7z 解压（比 unzip 更容错） ==="
          # Runner 已内置 7z，自动处理非标准尾部或编码问题
          7z x *.zip -o../dir -y -bb1
          
          echo "=== 解压结构检查 ==="
          ls -R ../dir/ | head -25
  
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dir  # 必须指向已解压的静态文件根目录
        
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
